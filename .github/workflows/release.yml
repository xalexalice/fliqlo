name: Publish standalone HTML clocks
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test && npm run build
      - run: python3 scripts/package-clocks.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" still-clocks-*.zip --verify-tag --title "Still 时刻 $GITHUB_REF_NAME" --notes-file .github/release-notes.md
